
[package]
name = "mdserve"
version = "1.2.0"
authors = ["jasonm23 <jasonm23@gmail.com>"]
edition = "2021"
rust-version = "1.82.0"
license = "MIT"
description = "Rust Markdown preview server with live reload, themes, Mermaid diagrams, and KaTeX math rendering. Fork of jfernandez/mdserve."
repository = "https://github.com/ocodo/mdserve"
homepage = "https://github.com/ocodo/mdserve"
documentation = "https://github.com/ocodo/mdserve#readme"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "fs", "time"] }
markdown = "1.0"
clap = { version = "4.5.45", features = ["derive"] }
tower = "0.5.2"
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
notify = "8.2.0"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
minijinja = "3.0.0"
minijinja-embed = { version = "3.0.0", default-features = false }

[build-dependencies]
minijinja-embed = { version = "3.0.0", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
axum-test = { version = "21.1", features = ["ws"] }
tempfile = "3.0"
tokio-test = "0.4"
